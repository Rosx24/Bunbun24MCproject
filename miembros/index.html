<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOUNELI | Miembros Admitidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-red: #CC2132;
    --c-orange: #E6692A;
    --c-amber: #ED9530;
    --c-cream: #E9BD96;
    --c-olive: #988A20;
    --c-teal: #34685C;
    --c-midnight: #1E404F;

    --bg: #142831;
    --bg-dark: #0d1b22;
    --bg-box: #0a171d;
    --border-box: #E9BD96;

    --text-white: #ffffff;
    --text-muted: #9bb7c2;
    --font-pixel: 'Press Start 2P', monospace;
    --font-ui: 'Outfit', -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text-white);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
    position: relative;
  }

  .stars-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

  .star {
    position: absolute;
    width: 7px; height: 7px;
    clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
    animation: twinkle 3s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { transform: scale(0.6); opacity: 0.25; }
    100% { transform: scale(1.6); opacity: 0.95; }
  }

  .header-bg-hero {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 520px;
    max-height: 65vh;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .header-bg-img {
    position: absolute;
    inset: 0;
    background-image: url('../assets/img/bg-minecraft.jpg');
    background-size: cover;
    background-position: center 25%;
    filter: brightness(0.9) contrast(1.04) saturate(1.08);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, rgba(0,0,0,0.5) 75%, transparent 98%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, rgba(0,0,0,0.5) 75%, transparent 98%);
  }

  .header-bg-gradient {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13, 27, 34, 0.65) 0%, rgba(13, 27, 34, 0) 18%),
      linear-gradient(180deg, transparent 35%, rgba(20, 40, 49, 0.7) 72%, var(--bg) 98%, var(--bg) 100%);
  }

  nav {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 6vw;
    background: linear-gradient(180deg, rgba(13, 27, 34, 0.75) 0%, rgba(13, 27, 34, 0) 100%);
    gap: 16px;
    flex-wrap: wrap;
  }

  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

  .nav-logo .pixel-heart {
    width: 14px; height: 14px;
    background: var(--c-red);
    clip-path: polygon(50% 100%, 0% 45%, 0% 15%, 25% 0%, 50% 25%, 75% 0%, 100% 15%, 100% 45%);
    animation: heartpulse 1.8s infinite;
  }

  @keyframes heartpulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }

  .nav-logo span {
    font-family: var(--font-pixel);
    font-size: 0.95rem;
    letter-spacing: 2px;
    color: #ffffff;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-btn-back {
    font-family: var(--font-pixel);
    font-size: 0.62rem;
    color: #ffffff;
    padding: 9px 16px;
    border: 1px solid var(--c-teal);
    background: rgba(30, 64, 79, 0.75);
    letter-spacing: 1px;
    text-decoration: none;
    transition: all 0.2s;
  }

  .nav-btn-back:hover { background: var(--c-teal); border-color: #ffffff; color: var(--c-cream); }

  main {
    position: relative;
    z-index: 2;
    padding: 20px 6vw 50px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .members-header { text-align: center; margin-bottom: 30px; }

  .hero-tag {
    font-family: var(--font-pixel);
    font-size: 0.72rem;
    color: var(--c-red);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  h1.members-title {
    font-family: var(--font-pixel);
    font-size: clamp(1.6rem, 4.2vw, 2.5rem);
    line-height: 1.3;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 3px 3px 0 #000000;
  }

  .members-box {
    background: var(--bg-box);
    border: 3px solid var(--border-box);
    padding: 30px 28px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .members-box-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 2px dashed rgba(52, 104, 92, 0.6);
  }

  .members-box-label {
    font-family: var(--font-pixel);
    font-size: 0.68rem;
    color: var(--c-cream);
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .members-box-label .dot { color: var(--c-red); }

  .members-count {
    font-family: var(--font-pixel);
    font-size: 0.65rem;
    color: var(--c-olive);
    letter-spacing: 1px;
  }

  ol.members-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .member-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #0e2028;
    border: 2px solid var(--c-teal);
    padding: 12px 16px;
    transition: border-color 0.15s, transform 0.15s;
  }

  .member-item:hover {
    border-color: var(--c-cream);
    transform: translateX(4px);
  }

  .member-index {
    font-family: var(--font-pixel);
    font-size: 0.78rem;
    color: var(--c-olive);
    min-width: 38px;
    letter-spacing: 1px;
  }

  .member-avatar-frame {
    width: 52px;
    height: 52px;
    background: #081318;
    border: 2px solid var(--c-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .member-avatar {
    width: 44px;
    height: 44px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  .member-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .member-nick {
    font-family: var(--font-pixel);
    font-size: 0.82rem;
    color: #ffffff;
    letter-spacing: 1.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .member-badge {
    font-family: var(--font-pixel);
    font-size: 0.55rem;
    color: var(--c-cream);
    background: var(--c-midnight);
    border: 1px solid var(--c-teal);
    padding: 6px 10px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  footer {
    position: relative;
    z-index: 10;
    padding: 24px 6vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    background: var(--bg-dark);
    border-top: 1px solid rgba(52, 104, 92, 0.35);
  }

  .footer-left, .footer-music { font-family: var(--font-pixel); font-size: 0.58rem; }
  .footer-music { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; transition: color 0.2s; }
  .footer-music:hover { color: var(--c-cream); }
  .footer-music.paused .sound-waves { animation: none; opacity: 0.3; }
  .footer-center { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; letter-spacing: 1px; }
  .footer-center .f-heart { color: var(--c-red); }
  .sound-waves { color: var(--c-cream); letter-spacing: 2px; animation: wavePulse 1s steps(2) infinite alternate; }

  @keyframes wavePulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

  @media (max-width: 650px) {
    .members-box { padding: 22px 16px; }
    .member-badge { display: none; }
    footer { flex-direction: column; gap: 16px; text-align: center; }
  }
</style>
</head>
<body>

  <div class="header-bg-hero">
    <div class="header-bg-img"></div>
    <div class="header-bg-gradient"></div>
  </div>

  <div class="stars-bg">
    <div class="star" style="top: 15%; left: 10%; background: var(--c-amber); animation-delay: 0s;"></div>
    <div class="star" style="top: 25%; left: 45%; background: var(--c-cream); animation-delay: 1.4s;"></div>
    <div class="star" style="top: 12%; left: 85%; background: var(--c-orange); animation-delay: 0.7s;"></div>
    <div class="star" style="top: 45%; left: 75%; background: var(--c-olive); animation-delay: 2.1s;"></div>
    <div class="star" style="top: 70%; left: 20%; background: var(--c-cream); animation-delay: 1.8s;"></div>
    <div class="star" style="top: 80%; left: 88%; background: var(--c-amber); animation-delay: 0.3s;"></div>
    <div class="star" style="top: 55%; left: 35%; background: var(--c-red); animation-delay: 1.1s;"></div>
  </div>

  <nav>
    <a href="../kouneli/" class="nav-logo">
      <span class="pixel-heart"></span>
      <span>KOUNELI</span>
    </a>
    <div class="nav-actions">
      <a href="../registro/" class="nav-btn-back">REGISTRO ✦</a>
      <a href="../kouneli/" class="nav-btn-back">← VOLVER</a>
    </div>
  </nav>

  <main>
    <div class="members-header">
      <div class="hero-tag">✦ COMUNIDAD ✦</div>
      <h1 class="members-title">ADMITIDOS</h1>
    </div>

    <div class="members-box">
      <div class="members-box-top">
        <span class="members-box-label">
          <span class="dot">✦</span>
          <span>LISTA DE JUGADORES</span>
        </span>
        <span class="members-count" id="members-count">TOTAL: 0</span>
      </div>

      <ol class="members-list" id="members-list"></ol>
    </div>
  </main>

  <footer>
    <div class="footer-left">MINECRAFT SERVER</div>
    <div class="footer-center">
      <span class="f-heart">✦</span>
      <span>2026 KOUNELI</span>
    </div>
    <div class="footer-music" id="music-toggle" title="Pausar / Reproducir música">
      <span>♫ Endless Horizon - Kaddebleh</span>
      <span class="sound-waves">ıılılı</span>
    </div>
  </footer>

  <audio id="bg-music" src="../assets/audio/endless-horizon.mp3" loop preload="auto"></audio>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtRoCIIQSITLw8y78IwP05AdvhsK_kKb51Ch0suly22m92QCL906-co_vy2CcG1JWI/exec';

    const BASE_ADMITTED = ['Rosx24'];

    const NICK_REGEX = /^[A-Za-z0-9_]{3,16}$/;
    const CONFIGURED = SCRIPT_URL.startsWith('https://script.google.com/');

    const listEl = document.getElementById('members-list');
    const countEl = document.getElementById('members-count');

    function mergeMembers(remote) {
      const list = [];
      const seen = new Set();
      [...BASE_ADMITTED, ...remote].forEach(nick => {
        const n = String(nick || '').trim();
        const key = n.toLowerCase();
        if (NICK_REGEX.test(n) && !seen.has(key)) {
          seen.add(key);
          list.push(n);
        }
      });
      return list;
    }

    function renderMembers(members) {
      countEl.textContent = `TOTAL: ${members.length}`;
      listEl.replaceChildren();

      members.forEach((nick, index) => {
        const li = document.createElement('li');
        li.className = 'member-item';

        const num = document.createElement('span');
        num.className = 'member-index';
        num.textContent = '#' + String(index + 1).padStart(2, '0');

        const frame = document.createElement('div');
        frame.className = 'member-avatar-frame';
        const img = document.createElement('img');
        img.className = 'member-avatar';
        img.alt = nick;
        img.src = `https://mc-heads.net/avatar/${encodeURIComponent(nick)}/64`;
        img.onerror = () => {
          img.onerror = null;
          img.src = `https://minotar.net/helm/${encodeURIComponent(nick)}/64.png`;
        };
        frame.appendChild(img);

        const info = document.createElement('div');
        info.className = 'member-info';
        const name = document.createElement('span');
        name.className = 'member-nick';
        name.textContent = nick;
        info.appendChild(name);

        const badge = document.createElement('span');
        badge.className = 'member-badge';
        badge.textContent = 'ADMITIDO';

        li.append(num, frame, info, badge);
        listEl.appendChild(li);
      });
    }

    function showNote(text) {
      const old = document.getElementById('members-note');
      if (old) old.remove();
      if (!text) return;
      const p = document.createElement('p');
      p.id = 'members-note';
      p.style.cssText = 'margin-top:16px;text-align:center;font-size:0.85rem;color:var(--text-muted);';
      p.textContent = text;
      listEl.after(p);
    }

    async function loadMembers() {
      renderMembers(mergeMembers([]));

      if (!CONFIGURED) {
        showNote('Falta configurar SCRIPT_URL en el código de la página.');
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('formato inesperado');
        renderMembers(mergeMembers(data));
        showNote('');
      } catch (err) {
        console.error(err);
        showNote('No se pudo actualizar la lista. Recarga la página en unos minutos.');
      }
    }

    loadMembers();

    const bgMusic = document.getElementById('bg-music');
    const musicToggle = document.getElementById('music-toggle');
    bgMusic.volume = 0.35;

    const savedTime = parseFloat(sessionStorage.getItem('kouneli_bgm_time') || '0');
    if (savedTime > 0) {
      bgMusic.addEventListener('loadedmetadata', () => {
        if (savedTime < bgMusic.duration) bgMusic.currentTime = savedTime;
      }, { once: true });
    }

    function updateMusicUI() {
      musicToggle.classList.toggle('paused', bgMusic.paused);
    }

    function saveProgress() {
      if (!bgMusic.paused) {
        sessionStorage.setItem('kouneli_bgm_time', String(bgMusic.currentTime));
      }
    }

    bgMusic.addEventListener('play', updateMusicUI);
    bgMusic.addEventListener('pause', updateMusicUI);
    bgMusic.addEventListener('timeupdate', saveProgress);
    window.addEventListener('pagehide', saveProgress);

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        sessionStorage.setItem('kouneli_bgm_paused', '0');
        bgMusic.play().catch(() => {});
      } else {
        sessionStorage.setItem('kouneli_bgm_paused', '1');
        bgMusic.pause();
      }
      updateMusicUI();
    });

    if (sessionStorage.getItem('kouneli_bgm_paused') !== '1') {
      bgMusic.play().then(updateMusicUI).catch(() => {
        updateMusicUI();
        const resumeOnInteract = () => {
          if (sessionStorage.getItem('kouneli_bgm_paused') !== '1') {
            bgMusic.play().then(updateMusicUI).catch(() => {});
          }
          window.removeEventListener('pointerdown', resumeOnInteract);
          window.removeEventListener('keydown', resumeOnInteract);
        };
        window.addEventListener('pointerdown', resumeOnInteract);
        window.addEventListener('keydown', resumeOnInteract);
      });
    } else {
      updateMusicUI();
    }
  </script>
</body>
</html>
