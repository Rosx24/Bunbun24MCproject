<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOUNELI | Servidor de Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Nueva paleta de colores */
    --c-red: #CC2132;
    --c-orange: #E6692A;
    --c-amber: #ED9530;
    --c-cream: #E9BD96;
    --c-olive: #988A20;
    --c-teal: #34685C;
    --c-midnight: #1E404F;
    --c-lime: #988A20;

    /* Base oscura para el tema */
    --bg: #142831;
    --bg-dark: #0d1b22;
    --bg-box: #0a171d;
    --border-box: #E9BD96;

    --text-white: #ffffff;
    --text-cream: #E9BD96;
    --text-muted: #9bb7c2;
    --font-pixel: 'Press Start 2P', monospace;
    --font-ui: 'Outfit', -apple-system, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: var(--bg);
    color: var(--text-white);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
    position: relative;
    background-image: 
      radial-gradient(ellipse at 75% 35%, rgba(52, 104, 92, 0.3) 0%, transparent 60%),
      radial-gradient(circle at 15% 80%, rgba(237, 149, 48, 0.08) 0%, transparent 50%);
  }

  /* Floating sparkle stars */
  .stars-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 7px;
    height: 7px;
    background: var(--c-amber);
    clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
    animation: twinkle 3s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { transform: scale(0.6); opacity: 0.25; }
    100% { transform: scale(1.6); opacity: 0.95; filter: drop-shadow(0 0 8px currentColor); }
  }

  /* ===== TOP HERO LANDSCAPE BACKGROUND ===== */
  .header-bg-hero {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 680px;
    max-height: 85vh;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .header-bg-img {
    position: absolute;
    inset: 0;
    background-image: url('bg-minecraft.jpg');
    background-size: cover;
    background-position: center 25%;
    background-repeat: no-repeat;
    /* Imagen más visible y nítida, sin tintado oscuro pesado */
    filter: brightness(0.9) contrast(1.04) saturate(1.08);
    mask-image: linear-gradient(to bottom, 
      rgba(0, 0, 0, 1) 0%, 
      rgba(0, 0, 0, 1) 50%, 
      rgba(0, 0, 0, 0.75) 75%, 
      rgba(0, 0, 0, 0) 100%
    );
    -webkit-mask-image: linear-gradient(to bottom, 
      rgba(0, 0, 0, 1) 0%, 
      rgba(0, 0, 0, 1) 50%, 
      rgba(0, 0, 0, 0.75) 75%, 
      rgba(0, 0, 0, 0) 100%
    );
  }

  .header-bg-gradient {
    position: absolute;
    inset: 0;
    background: 
      /* Barra superior suave para que los enlaces de navegación se lean perfecto */
      linear-gradient(180deg, rgba(13, 27, 34, 0.65) 0%, rgba(13, 27, 34, 0) 18%),
      /* Difuminado suave hacia el fondo inferior sin tapar la parte central */
      linear-gradient(180deg, transparent 40%, rgba(20, 40, 49, 0.6) 72%, var(--bg) 100%),
      /* Sutil viñeta izquierda solo detrás del texto para garantizar legibilidad */
      radial-gradient(ellipse at 25% 45%, rgba(13, 27, 34, 0.6) 0%, rgba(13, 27, 34, 0.2) 50%, transparent 70%);
  }

  /* ===== HEADER / NAVIGATION ===== */
  nav {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 6vw;
    background: linear-gradient(180deg, rgba(13, 27, 34, 0.75) 0%, rgba(13, 27, 34, 0) 100%);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text-white);
  }

  .nav-logo .pixel-heart {
    width: 14px;
    height: 14px;
    background: var(--c-red);
    display: inline-block;
    clip-path: polygon(50% 100%, 0% 45%, 0% 15%, 25% 0%, 50% 25%, 75% 0%, 100% 15%, 100% 45%);
    filter: drop-shadow(0 0 6px var(--c-red));
    animation: heartpulse 1.8s infinite;
  }

  @keyframes heartpulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }

  .nav-logo span {
    font-family: var(--font-pixel);
    font-size: 0.95rem;
    letter-spacing: 2px;
    color: #ffffff;
    transition: color 0.2s;
  }

  .nav-logo:hover span {
    color: var(--c-cream);
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    font-family: var(--font-pixel);
    font-size: 0.65rem;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 1.5px;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: #ffffff;
  }

  .nav-badge {
    font-family: var(--font-pixel);
    font-size: 0.62rem;
    color: #ffffff;
    padding: 8px 16px;
    border: 1px solid var(--c-teal);
    background: rgba(30, 64, 79, 0.75);
    letter-spacing: 1px;
  }

  /* ===== HERO CONTENT SECTION ===== */
  main {
    position: relative;
    z-index: 2;
    padding: 10px 6vw 40px;
    max-width: 1300px;
    margin: 0 auto;
    width: 100%;
  }

  .hero-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 48vh;
    padding: 30px 0;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-pixel);
    font-size: 0.72rem;
    color: var(--c-amber);
    letter-spacing: 2px;
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  .hero-tag::after {
    content: "✦";
    font-size: 0.85rem;
    color: var(--c-red);
  }

  h1.hero-title {
    font-family: var(--font-pixel);
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    line-height: 1.25;
    letter-spacing: 2px;
    color: #ffffff;
    margin-bottom: 30px;
    text-shadow: 3px 3px 0 #000000;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .badge-date {
    font-family: var(--font-pixel);
    font-size: 0.75rem;
    background: rgba(20, 40, 49, 0.85);
    color: var(--c-red);
    border: 2px solid var(--c-red);
    padding: 14px 26px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 1px;
  }

  .badge-date span.star-ico {
    color: var(--c-red);
  }

  /* ===== BOTTOM RPG UI HUD ===== */
  .hud-container {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 20px;
    max-width: 950px;
    margin: 28px auto 0;
    width: 100%;
  }

  .hud-box {
    background: var(--bg-box);
    border: 3px solid var(--border-box);
    padding: 24px 26px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  /* Countdown grid inside Box */
  .countdown-timer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .cd-cell {
    background: #0e2028;
    border: 1px solid var(--c-teal);
    padding: 12px 6px;
    text-align: center;
  }

  .cd-num {
    font-family: var(--font-pixel);
    font-size: 1.25rem;
    color: #988A20;
    display: block;
    margin-bottom: 6px;
    text-shadow: none;
  }

  .cd-lbl {
    font-family: var(--font-pixel);
    font-size: 0.55rem;
    color: #ffffff;
    text-transform: uppercase;
  }

  /* Quote & Date */
  .hud-quote {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .quote-icon {
    font-size: 2.2rem;
    color: var(--c-cream);
    flex-shrink: 0;
    line-height: 1;
  }

  .quote-body {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #ffffff;
  }

  .quote-author {
    margin-top: 8px;
    font-family: var(--font-pixel);
    font-size: 0.65rem;
    color: #988A20;
    text-shadow: none;
  }

  /* ===== FOOTER ===== */
  footer {
    position: relative;
    z-index: 10;
    padding: 24px 6vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: var(--text-muted);
    background: var(--bg-dark);
    border-top: 1px solid rgba(52, 104, 92, 0.35);
  }

  .footer-left {
    font-family: var(--font-pixel);
    font-size: 0.6rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .footer-center {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .footer-center .f-heart {
    color: var(--c-red);
    font-size: 0.85rem;
  }

  .footer-music {
    font-family: var(--font-pixel);
    font-size: 0.55rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sound-waves {
    color: var(--c-cream);
    letter-spacing: 2px;
    animation: wavePulse 1s steps(2) infinite alternate;
  }

  @keyframes wavePulse {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 980px) {
    .hero-grid {
      grid-template-columns: 1fr;
      text-align: center;
      gap: 30px;
    }
    .hero-actions {
      justify-content: center;
    }
    .hud-container {
      grid-template-columns: 1fr;
    }
    .hero-art-container {
      max-width: 300px;
    }
    .nav-links {
      display: none;
    }
    footer {
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <!-- Top Hero Landscape Background with Aesthetic Gradient Fade -->
  <div class="header-bg-hero">
    <div class="header-bg-img"></div>
    <div class="header-bg-gradient"></div>
  </div>

  <!-- Background sparkles with palette colors -->
  <div class="stars-bg">
    <div class="star" style="top: 15%; left: 10%; background: var(--c-amber); animation-delay: 0s;"></div>
    <div class="star" style="top: 25%; left: 45%; background: var(--c-cream); animation-delay: 1.4s;"></div>
    <div class="star" style="top: 12%; left: 85%; background: var(--c-orange); animation-delay: 0.7s;"></div>
    <div class="star" style="top: 45%; left: 75%; background: var(--c-olive); animation-delay: 2.1s;"></div>
    <div class="star" style="top: 70%; left: 20%; background: var(--c-cream); animation-delay: 1.8s;"></div>
    <div class="star" style="top: 80%; left: 88%; background: var(--c-amber); animation-delay: 0.3s;"></div>
    <div class="star" style="top: 55%; left: 35%; background: var(--c-red); animation-delay: 1.1s;"></div>
  </div>

  <!-- Navigation Bar -->
  <nav>
    <a href="#" class="nav-logo">
      <span class="pixel-heart"></span>
      <span>KOUNELI</span>
    </a>
    <ul class="nav-links">
      <li><a href="#inicio">INICIO</a></li>
      <li><a href="#apertura">APERTURA</a></li>
    </ul>
    <div class="nav-badge">20 · 11 · 2026</div>
  </nav>

  <!-- Hero Content -->
  <main id="inicio">
    <div class="hero-grid">
      <div class="hero-left">
        <div class="hero-tag">✦ MINECRAFT SERVER SMP </div>
        <h1 class="hero-title">
          KOUNELI
        </h1>
        <div class="hero-actions">
          <div class="badge-date">
            <span class="star-ico">✦</span>
            <span>20 DE NOVIEMBRE</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Undertale-style Battle Box / HUD Section -->
    <div class="hud-container" id="apertura">
      <!-- Countdown Box -->
      <div class="hud-box">
        <div class="countdown-timer-grid">
          <div class="cd-cell">
            <span class="cd-num" id="cd-d">00</span>
            <span class="cd-lbl">Días</span>
          </div>
          <div class="cd-cell">
            <span class="cd-num" id="cd-h">00</span>
            <span class="cd-lbl">Horas</span>
          </div>
          <div class="cd-cell">
            <span class="cd-num" id="cd-m">00</span>
            <span class="cd-lbl">Min</span>
          </div>
          <div class="cd-cell">
            <span class="cd-num" id="cd-s">00</span>
            <span class="cd-lbl">Seg</span>
          </div>
        </div>
      </div>

      <!-- Box 3: Quote -->
      <div class="hud-box">
        <div class="hud-quote">
          <div class="quote-icon">✦</div>
          <div class="quote-body">
            <p>"Seguimos esperando por la conexión."</p>
            <p class="quote-author">- Kouneli · 20 de Noviembre</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-left">
      <span>MINECRAFT SERVER</span>
    </div>

    <div class="footer-center">
      <span class="f-heart">✦</span>
      <span>2026 KOUNELI</span>
    </div>

    <div class="footer-music">
      <span>♫ THEME</span>
      <span class="sound-waves">ıılılı</span>
    </div>
  </footer>

  <!-- Countdown Logic -->
  <script>
    // Countdown Target: 22 de Noviembre
    let year = new Date().getFullYear();
    let targetDate = new Date(year, 10, 22, 0, 0, 0);
    if (targetDate.getTime() < Date.now()) {
      targetDate = new Date(year + 1, 10, 22, 0, 0, 0);
    }
    const target = targetDate.getTime();
    const pad = n => String(n).padStart(2, '0');

    function updateCountdown() {
      const now = Date.now();
      let diff = Math.max(0, target - now);

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff %= (1000 * 60 * 60 * 24);
      const h = Math.floor(diff / (1000 * 60 * 60));
      diff %= (1000 * 60 * 60);
      const m = Math.floor(diff / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-d').textContent = pad(d);
      document.getElementById('cd-h').textContent = pad(h);
      document.getElementById('cd-m').textContent = pad(m);
      document.getElementById('cd-s').textContent = pad(s);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
