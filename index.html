<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOUNELI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #142831;
    overflow: hidden;
    position: relative;
    font-family: 'Press Start 2P', monospace;
  }

  .bg-image {
    position: fixed;
    inset: 0;
    background-image: url('assets/img/bg-minecraft.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: brightness(0.9) contrast(1.04) saturate(1.08);
    z-index: 1;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(13, 27, 34, 0.35) 0%, rgba(20, 40, 49, 0.75) 100%);
    z-index: 2;
  }

  .portal-container {
    position: relative;
    z-index: 10;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .portal-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.9rem, 2.5vw, 1.25rem);
    color: #ffffff;
    background: #1E404F;
    border: 3px solid #E9BD96;
    padding: 24px 52px;
    text-decoration: none;
    letter-spacing: 2px;
    box-shadow: 0 8px 0 #0a171d, 0 16px 32px rgba(0, 0, 0, 0.6);
    transition: all 0.15s ease-in-out;
    cursor: pointer;
    text-shadow: none;
    user-select: none;
  }

  .portal-btn:hover {
    background: #34685C;
    border-color: #ffffff;
    color: #E9BD96;
    transform: translateY(-2px);
    box-shadow: 0 10px 0 #0a171d, 0 20px 36px rgba(0, 0, 0, 0.7);
  }

  .portal-btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #0a171d;
  }
</style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="portal-container">
    <a href="kouneli/" class="portal-btn">
      ENTRAR
    </a>
  </div>

</body>
</html>
